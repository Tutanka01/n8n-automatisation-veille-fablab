# Veille scientifique UPPA -> contenus FabLab
# Stack : n8n (orchestration) + PostgreSQL (n8n + base "veille") + Gotenberg (HTML -> PDF)
#
# Démarrage : `make install` la première fois (génère .env), puis `make up`.
# Le conteneur n8n se provisionne lui-même à chaque démarrage (n8n/provision/) : base « veille »,
# identifiants, compte propriétaire et workflows publiés. `docker compose up -d` suffit donc toujours.

name: veille-fablab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: n8n
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging: *logging

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --chromium-auto-start=true
      - --libreoffice-auto-start=false
      - --log-level=warn
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    # Provisionne l'instance (n8n/provision/provision.js) puis lance n8n normalement.
    entrypoint: ["tini", "--", "/bin/sh", "/opt/veille/provision/entrypoint.sh"]
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      # Base de données
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Sécurité : clé de chiffrement des identifiants (NE JAMAIS la perdre ni la changer)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?définir N8N_ENCRYPTION_KEY dans .env}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # URL publique (liens des webhooks / de l'interface de validation)
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}/
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}/
      # Fuseau horaire des déclencheurs planifiés
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
      TZ: ${TZ:-Europe/Paris}
      # Hygiène : purge des exécutions, pas de télémétrie
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      # Le code des nœuds « Code » s'exécute dans le conteneur isolé task-runners
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?définir N8N_RUNNERS_AUTH_TOKEN dans .env}
      N8N_RUNNERS_TASK_TIMEOUT: "120"
      # Valeurs explicites (futurs défauts de n8n)
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Lus par le provisionnement au démarrage, puis retirés de l'environnement de n8n.
      # Modifier .env puis `make up` : Compose recrée le conteneur et tout est resynchronisé.
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:?définir N8N_OWNER_EMAIL dans .env}
      N8N_OWNER_FIRSTNAME: ${N8N_OWNER_FIRSTNAME:-}
      N8N_OWNER_LASTNAME: ${N8N_OWNER_LASTNAME:-}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:?définir N8N_OWNER_PASSWORD dans .env}
      VEILLE_DB_PASSWORD: ${VEILLE_DB_PASSWORD:?définir VEILLE_DB_PASSWORD dans .env}
      VEILLE_UI_USER: ${VEILLE_UI_USER:?définir VEILLE_UI_USER dans .env}
      VEILLE_UI_PASSWORD: ${VEILLE_UI_PASSWORD:?définir VEILLE_UI_PASSWORD dans .env}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      # Dossier accessible aux nœuds "fichiers" (restriction par défaut de n8n : ~/.n8n-files)
      - ./config:/home/node/.n8n-files/config:ro
      - ./output:/home/node/.n8n-files/output
      # Provisionnement au démarrage : script, workflows versionnés, schéma de la base « veille »
      - ./n8n/provision:/opt/veille/provision:ro
      - ./n8n/workflows:/opt/veille/workflows:ro
      - ./db:/opt/veille/db:ro
    extra_hosts:
      # Permet d'utiliser un LLM local (Ollama, LM Studio…) : http://host.docker.internal:11434/v1
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      # « Sain » = l'interface de validation est réellement servie (webhook enregistré : 401 sans
      # mot de passe), pas seulement n8n démarré. Un 404 ici = workflows non publiés.
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/webhook/veille').then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  task-runners:
    image: n8nio/runners:${N8N_VERSION:-2.40.7}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_TIMEOUT: "120"
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "300"
      GENERIC_TIMEZONE: ${TZ:-Europe/Paris}
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5680/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

volumes:
  postgres_data:
  n8n_data:
